# Wird von Ansible aus dem Template roles/monitoring/templates/prometheus.yml.j2 generiert.
# Diese Datei ist nur zur Dokumentation — nicht direkt verwenden.
#
# Variablen die Ansible ersetzt:
#   {{ app_server_ip }}              — öffentliche IP des App-Servers
#   {{ shop_domain }}                — Domain des Shops
#   host-gateway                     — löst sich im Prometheus-Container zur Host-IP auf (Docker extra_hosts)

global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: node
    static_configs:
      - targets: ["APP_SERVER_IP:9100"]
        labels:
          instance: shop
      - targets: ["host-gateway:9100"]
        labels:
          instance: monitoring

  - job_name: cadvisor
    static_configs:
      - targets: ["APP_SERVER_IP:8080"]
        labels:
          instance: shop

  - job_name: postgres
    static_configs:
      - targets: ["APP_SERVER_IP:9187"]
        labels:
          instance: shop

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://SHOP_DOMAIN/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
