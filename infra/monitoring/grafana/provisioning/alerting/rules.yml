apiVersion: 1

groups:
  - orgId: 1
    name: shop
    folder: Shop
    interval: 1m
    rules:

      # ── Erreichbarkeit ───────────────────────────────────────────────────────

      - uid: app-down
        title: App nicht erreichbar
        condition: C
        for: 2m
        annotations:
          summary: "{{ $labels.instance }} antwortet nicht"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: probe_success{job="blackbox"}
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [1], type: lt }

      - uid: slow-response
        title: Langsame Antwortzeit
        condition: C
        for: 5m
        annotations:
          summary: "Antwortzeit {{ $value | humanizeDuration }} — Grenzwert 3s"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: probe_duration_seconds{job="blackbox"}
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [3], type: gt }

      - uid: tls-expiry
        title: TLS-Zertifikat läuft bald ab
        condition: C
        for: 1m
        annotations:
          summary: "TLS-Zertifikat läuft in {{ printf \"%.0f\" $value }} Tagen ab"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: (probe_ssl_earliest_cert_expiry - time()) / 86400
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [14], type: lt }

      # ── HTTP-Fehler (via Caddy Access Logs) ─────────────────────────────────

      - uid: high-error-rate
        title: Hohe Fehlerrate
        condition: C
        for: 5m
        annotations:
          summary: "Mehr als 10% 5xx-Antworten in den letzten 5 Minuten"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              expr: |
                sum(rate({container="shop-caddy-1"} | json | logger="http.log.access" | status >= 500 [5m]))
                / sum(rate({container="shop-caddy-1"} | json | logger="http.log.access" [5m]))
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [0.1], type: gt }

      - uid: error-log-spike
        title: Fehler-Logs häufen sich
        condition: C
        for: 5m
        annotations:
          summary: "Mehr als 5 ERROR-Log-Einträge pro Minute in den letzten 5 Minuten"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              expr: sum(rate({container="shop-app-1", level="error"}[5m])) * 60
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [5], type: gt }

      # ── System-Ressourcen ────────────────────────────────────────────────────

      - uid: disk-full
        title: Disk-Auslastung hoch
        condition: C
        for: 5m
        annotations:
          summary: "Disk auf {{ $labels.instance }} zu {{ $value | humanizePercentage }} belegt"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: |
                1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"}
                  / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"})
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [0.8], type: gt }

      - uid: cpu-high
        title: CPU-Auslastung hoch
        condition: C
        for: 10m
        annotations:
          summary: "CPU auf {{ $labels.instance }}: {{ printf \"%.0f\" $value }}% Auslastung"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: |
                100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [85], type: gt }

      - uid: ram-high
        title: RAM-Auslastung hoch
        condition: C
        for: 5m
        annotations:
          summary: "RAM auf {{ $labels.instance }} zu {{ $value | humanizePercentage }} belegt"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: |
                1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [0.9], type: gt }

      - uid: container-oom
        title: Container OOM-Kill
        condition: C
        for: 1m
        annotations:
          summary: "Container {{ $labels.name }} wurde wegen Speichermangel beendet (OOM)"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: increase(container_oom_events_total{name!=""}[5m])
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [0], type: gt }

      # ── Datenbank ────────────────────────────────────────────────────────────

      - uid: postgres-down
        title: PostgreSQL nicht erreichbar
        condition: C
        for: 2m
        annotations:
          summary: "PostgreSQL nicht erreichbar — Datenbankverbindung ausgefallen"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: pg_up{job="postgres"}
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [1], type: lt }

      - uid: postgres-connections-high
        title: PostgreSQL Verbindungen hoch
        condition: C
        for: 5m
        annotations:
          summary: "PostgreSQL hat {{ printf \"%.0f\" $value }} aktive Verbindungen (Limit: 100)"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: pg_stat_database_numbackends{datname="shop"}
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [70], type: gt }

      # ── Backup & Cron (Deadman's Switch) ────────────────────────────────────

      - uid: backup-missing
        title: Kein Backup in den letzten 26 Stunden
        condition: C
        noDataState: OK
        execErrState: Alerting
        for: 1m
        annotations:
          summary: "Kein erfolgreicher Backup-Lauf in den letzten 26 Stunden"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              expr: absent_over_time({container="shop-backup-1"} |= "Backup complete" [26h])
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [0], type: gt }

      - uid: cron-reminder-missing
        title: Reminder-Cron nicht ausgeführt
        condition: C
        noDataState: OK
        execErrState: Alerting
        for: 1m
        annotations:
          summary: "Der Reminder-Cron wurde in den letzten 25 Stunden nicht ausgeführt"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              expr: absent_over_time({container="shop-app-1"} |= "Reminder-Mails werden versendet" [25h])
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [0], type: gt }

      - uid: cron-cleanup-missing
        title: Cleanup-Cron nicht ausgeführt
        condition: C
        noDataState: OK
        execErrState: Alerting
        for: 1m
        annotations:
          summary: "Der Cleanup-Cron wurde in den letzten 25 Stunden nicht ausgeführt"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: loki
            model:
              expr: absent_over_time({container="shop-app-1"} |= "Reservierungen bereinigt" [25h])
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [0], type: gt }

      # ── Kundenfluss-Alerts ───────────────────────────────────────────────────

      - uid: slot-nearly-full
        title: Abholslot fast ausgebucht
        condition: C
        for: 2m
        annotations:
          summary: "Slot \"{{ $labels.slot_label }}\" ist zu {{ $value | humanizePercentage }} ausgebucht"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: slot_occupancy_occupancy_ratio
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [0.8], type: gt }

      - uid: slot-full-spike
        title: Slot-voll-Fehler häufen sich
        condition: C
        for: 1m
        annotations:
          summary: "{{ printf \"%.0f\" $value }} Slot-voll-Fehler in 10 Minuten — ein Slot läuft über"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: loki
            model:
              expr: sum(count_over_time({container="shop-app-1", event="slot_full"} [10m]))
          - refId: B
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: "__expr__"
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: { params: [3], type: gt }

policies:
  - orgId: 1
    receiver: email
